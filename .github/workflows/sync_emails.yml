name: Recovery E-postalarını Senkronize Et

on:
  schedule:
    - cron: '*/30 * * * *' # 30 dakikada bir çalışır
  workflow_dispatch: # Elinle tetikleyebilmen için

jobs:
  sync_emails:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu indir
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bağımlılıkları kur
        run: npm install @supabase/supabase-js dotenv

      - name: E-postaları senkronize et
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync-auth-emails.mjs
