name: Dünya Kupası Maçlarını Otomatik Çek
on:
  schedule:
    - cron: '*/10 * * * *' # 10 dakikada bir çalışır, GitHub'ın gecikmelerine karşı boşluğu azaltır
  workflow_dispatch: # Elinle tetikleyebilmen için

jobs:
  sync_matches:
    runs-on: ubuntu-latest
    steps:
      - name: API'den Dünya Kupası Takvimini Çek ve Supabase'e Yaz
        run: |
          echo "⚽ Football API bağlantısı kuruluyor..."
          
          # 1) API'den Dünya Kupası maçlarını al
          API_DATA=$(curl -s -H "X-Auth-Token: ${{ secrets.FOOTBALL_API_TOKEN }}" "https://api.football-data.org/v4/competitions/WC/matches")
          
          if [[ -z "$API_DATA" || "$API_DATA" == *"error"* ]]; then
            echo "❌ API hatası! Gelen veri:"
            echo "$API_DATA"
            exit 1
          fi

          echo "🚀 Mevcut kilit durumlarını kontrol etmek için Supabase'den güncel maç listesini çekiyoruz..."
          # Supabase'deki mevcut maçların kilit durumlarını çekiyoruz ki boşuna geçmişi güncellemeyelim
          DB_MATCHES=$(curl -s -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" "${{ secrets.SUPABASE_URL }}/rest/v1/matches?select=external_id,locked,actual_home,actual_away")

          echo "🚀 Maç verileri akıllı filtre ile işleniyor..."

          node -e "
          const data = $API_DATA;
          const dbMatches = $DB_MATCHES || [];
          
          // Supabase'de zaten kilitlenmiş VE skoru girilmiş maçların external_id'lerini bir Set'e atıyoruz.
          // Skoru henüz null olan kilitli maçları tekrar deniyoruz ki geçici hatalarda skor otomatik tamamlansın.
          const lockedInDB = new Set(dbMatches.filter(m =>
            (m.locked === true || m.locked === 'true') &&
            m.actual_home !== null && m.actual_away !== null
          ).map(m => String(m.external_id)));

          if (!data.matches || data.matches.length === 0) {
            console.log('⚠ Maç bulunamadı.');
            process.exit(0);
          }

          async function sync() {
            // API'den gelen maçları filtrele: Sadece veritabanında henüz KİLİTLENMEMİŞ olanları veya yeni bitenleri işleme al!
            const targetMatches = data.matches.filter(m => !lockedInDB.has(String(m.id)));
            
            console.log(\`📦 Toplam \${data.matches.length} maçtan, güncellenmesi gereken \${targetMatches.length} maç işleniyor...\\n\`);

            for (const m of targetMatches) {
              if (m.status === 'FINISHED') {
                console.log(\`🔎 DEBUG \${m.homeTeam.name} - \${m.awayTeam.name} score:\`, JSON.stringify(m.score));
              }
              const matchPayload = {
                external_id: String(m.id),
                home_team: m.homeTeam.name,
                away_team: m.awayTeam.name,
                match_date: m.utcDate.split('T')[0],
                match_datetime: m.utcDate,
                round: m.stage === 'GROUP_STAGE' ? 'Grup Aşaması' : m.stage,
                // Maç FINISHED olsa bile API skoru geç gönderebiliyor; skor gelene kadar
                // kilitlemiyoruz ki bir sonraki çalıştırmada tekrar denenip otomatik tamamlansın.
                locked: m.status === 'FINISHED' && m.score.fullTime.home !== null && m.score.fullTime.away !== null,
                // fullTime skorunu alıyoruz; uzatmalar dahil, penaltılar hariçtir!
                actual_home: m.score.fullTime.home !== null ? m.score.fullTime.home : null,
                actual_away: m.score.fullTime.away !== null ? m.score.fullTime.away : null
              };

              try {
                const res = await fetch('${{ secrets.SUPABASE_URL }}/rest/v1/matches?on_conflict=external_id', {
                  method: 'POST',
                  headers: {
                    'apikey': '${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}',
                    'Authorization': 'Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}',
                    'Content-Type': 'application/json',
                    'Prefer': 'resolution=merge-duplicates'
                  },
                  body: JSON.stringify(matchPayload)
                });

                if (res.ok) {
                  console.log(\`✅ Güncellendi: \${m.homeTeam.name} - \${m.awayTeam.name} (Durum: \${m.status})\`);
                } else {
                  const errBody = await res.text();
                  console.error(\`❌ Başarısız: \${m.homeTeam.name} - \${m.awayTeam.name} (HTTP \${res.status}): \${errBody}\`);
                }
              } catch (e) {
                console.error('Hata:', e.message);
              }
            }
            console.log('\\n🎉 Senkronizasyon başarıyla tamamlandı!');
          }
          sync();
          "
