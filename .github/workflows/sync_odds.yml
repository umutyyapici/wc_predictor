name: Maç Odds Senkronizasyonu (mackolik)

on:
  schedule:
    - cron: '0 9 * * *'  # Her gün 09:00 UTC = 12:00 TRT
  workflow_dispatch:

jobs:
  sync_odds:
    runs-on: ubuntu-latest
    steps:
      - name: Cache Puppeteer Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-v1

      - name: Puppeteer kur
        run: npm install puppeteer

      - name: Maç oranlarını çek
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node --input-type=module << 'JSEOF'
          import puppeteer from 'puppeteer';

          const SB_URL = process.env.SUPABASE_URL;
          const SB_KEY = process.env.SUPABASE_KEY;
          const FIXTURE_URL = 'https://www.mackolik.com/kupa/dünya-dünya-kupaşı/fikstur/70excpe1synn9kadnbppahdn7';

          const TR_EN = {
            'Çekya': 'Czechia', 'Güney Afrika': 'South Africa', 'İsviçre': 'Switzerland',
            'Bosna-Hersek': 'Bosnia and Herzegovina', 'Kanada': 'Canada', 'Katar': 'Qatar',
            'Meksika': 'Mexico', 'Güney Kore': 'South Korea', 'ABD': 'United States',
            'Avustralya': 'Australia', 'İskoçya': 'Scotland', 'Fas': 'Morocco',
            'Brezilya': 'Brazil', 'Haiti': 'Haiti', 'Türkiye': 'Turkey',
            'Paraguay': 'Paraguay', 'Hollanda': 'Netherlands', 'İsveç': 'Sweden',
            'Almanya': 'Germany', 'Fildişi Sahili': 'Ivory Coast', 'Ekvador': 'Ecuador',
            'Curaçao': 'Curaçao', 'Tunus': 'Tunisia', 'Japonya': 'Japan',
            'İspanya': 'Spain', 'S. Arabistan': 'Saudi Arabia', 'Belçika': 'Belgium',
            'İran': 'Iran', 'Uruguay': 'Uruguay', 'Yeşil Burun': 'Cape Verde',
            'Yeni Zelanda': 'New Zealand', 'Mısır': 'Egypt', 'Arjantin': 'Argentina',
            'Avusturya': 'Austria', 'Fransa': 'France', 'Irak': 'Iraq',
            'Norveç': 'Norway', 'Senegal': 'Senegal', 'Ürdün': 'Jordan',
            'Cezayir': 'Algeria', 'Portekiz': 'Portugal', 'Özbekistan': 'Uzbekistan',
            'İngiltere': 'England', 'Gana': 'Ghana', 'Panama': 'Panama',
            'Hırvatistan': 'Croatia', 'Kolombiya': 'Colombia',
            'Demokratik Kongo C.': 'Congo DR', 'Kongo DR': 'Congo DR',
            'Sırbistan': 'Serbia', 'Polonya': 'Poland', 'Danimarka': 'Denmark',
            'Macaristan': 'Hungary', 'Nijerya': 'Nigeria', 'Kamerun': 'Cameroon',
          };

          // DB'den tüm maçları çek
          const dbRes = await fetch(
            `${SB_URL}/rest/v1/matches?select=id,match_datetime,home_team,away_team&order=match_datetime`,
            { headers: { apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}` } }
          );
          const dbMatches = await dbRes.json();
          const now = new Date();
          console.log(`📚 DB: ${dbMatches.length} maç`);

          // TR isim → DB maç eşleme (her iki takımla birlikte)
          function findDbMatch(homeTR, awayTR) {
            const homeEN = TR_EN[homeTR];
            const awayEN = TR_EN[awayTR];
            if (!homeEN || !awayEN) return null;
            const norm = s => s.toLowerCase().replace(/[^a-z]/g, '');
            return dbMatches.find(m =>
              norm(m.home_team).includes(norm(homeEN)) &&
              norm(m.away_team).includes(norm(awayEN))
            ) || null;
          }

          // TR isim → slug dönüşümü (ters yön, fixture link eşleştirmek için)
          function trToSlug(name) {
            return name.toLowerCase()
              .replace(/İ/g, 'i').replace(/ı/g, 'i')
              .replace(/ğ/g, 'g').replace(/ü/g, 'u')
              .replace(/ş/g, 's').replace(/ö/g, 'o')
              .replace(/ç/g, 'c').replace(/â/g, 'a')
              .replace(/[^a-z0-9]/g, '-')
              .replace(/-+/g, '-').replace(/^-|-$/g, '');
          }

          // Consent kabul
          async function acceptConsent(pg) {
            for (const frame of [pg.mainFrame(), ...pg.frames()]) {
              try {
                const clicked = await frame.evaluate(() => {
                  const btns = [...document.querySelectorAll('button,[role="button"]')];
                  const btn = btns.find(b => {
                    const t = (b.innerText || b.textContent || '').toLowerCase().replace(/\s+/g, ' ').trim();
                    return (t.includes('kabul') && !t.includes('reddet')) ||
                           t === 'accept all' || t === 'allow all' || t === 'agree and close';
                  });
                  if (btn) { btn.click(); return (btn.innerText || btn.textContent).trim().slice(0, 50); }
                  return null;
                });
                if (clicked) { console.log(`🍪 Consent: "${clicked}"`); return true; }
              } catch {}
            }
            return false;
          }

          const browser = await puppeteer.launch({
            args: ['--no-sandbox', '--disable-setuid-sandbox', '--disable-dev-shm-usage'],
          });
          const page = await browser.newPage();
          await page.setUserAgent(
            'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36'
          );
          await page.setExtraHTTPHeaders({ 'Accept-Language': 'tr-TR,tr;q=0.9' });
          await page.evaluateOnNewDocument(() => {
            Object.defineProperty(navigator, 'webdriver', { get: () => undefined });
          });

          // Ana sayfa → consent
          await page.goto('https://www.mackolik.com/', { waitUntil: 'domcontentloaded', timeout: 30000 }).catch(() => {});
          await new Promise(r => setTimeout(r, 2000));
          await acceptConsent(page);
          await new Promise(r => setTimeout(r, 1500));

          // ── PHASE 1: Fixture sayfasından match URL'lerini topla ──
          console.log('\n📡 Fixture sayfası...');
          await page.goto(FIXTURE_URL, { waitUntil: 'domcontentloaded', timeout: 45000 }).catch(() => {});
          await new Promise(r => setTimeout(r, 2000));
          await acceptConsent(page);
          await page.evaluate(() => window.scrollTo(0, document.body.scrollHeight));
          await new Promise(r => setTimeout(r, 3000));

          const allMacLinks = await page.$$eval('a[href]', els =>
            [...new Set(
              els.map(e => e.getAttribute('href'))
                 .filter(h => h && h.includes('/mac/') && h.includes('-vs-'))
                 .map(h => { try { return new URL(h).pathname; } catch { return h; } })
            )]
          );
          console.log(`🔗 ${allMacLinks.length} maç URL'i bulundu`);

          // Match URL'inden iddaa URL'i oluştur:
          // /mac/team-vs-team/HASH → /mac/team-vs-team/iddaa/HASH
          function matchPathToIddaaPath(matchPath) {
            return matchPath.replace(/\/([^/]+)$/, '/iddaa/$1');
          }

          // ── PHASE 2: /iddaa genel sayfasından 1X2 oranları çek ──
          console.log('\n📡 /iddaa genel sayfası...');
          await page.goto('https://www.mackolik.com/iddaa', { waitUntil: 'domcontentloaded', timeout: 30000 }).catch(() => {});
          await new Promise(r => setTimeout(r, 2000));
          await acceptConsent(page);
          await page.evaluate(() => window.scrollTo(0, document.body.scrollHeight));
          await new Promise(r => setTimeout(r, 3000));

          // WOC satırlarını parse et
          const wocRows = await page.evaluate(() => {
            const results = [];
            for (const tr of document.querySelectorAll('table tr')) {
              const cells = [...tr.querySelectorAll('td')];
              if (!cells.length) continue;
              const infoCell = cells.find(c => c.innerText.includes('WOC'));
              if (!infoCell) continue;
              const lines = infoCell.innerText.split('\n').map(l => l.trim()).filter(Boolean);
              const wocIdx = lines.indexOf('WOC');
              if (wocIdx < 0 || lines.length < wocIdx + 4) continue;
              const homeTeam = lines[wocIdx + 2];
              const awayTeam = lines[wocIdx + 3];
              const odds = cells
                .filter(c => c !== infoCell)
                .map(c => c.innerText.trim())
                .filter(v => /^\d+\.\d+$/.test(v))
                .map(parseFloat);
              if (odds.length < 3 || !homeTeam || !awayTeam) continue;
              results.push({ homeTeam, awayTeam, homeOdd: odds[0], drawOdd: odds[1], awayOdd: odds[2] });
            }
            return results;
          });

          console.log(`⚽ ${wocRows.length} WOC maçı (1X2 oranları alındı)`);
          wocRows.forEach(r => console.log(`  ${r.homeTeam} vs ${r.awayTeam}: ${r.homeOdd}/${r.drawOdd}/${r.awayOdd}`));

          // ── PHASE 3: Her WOC maçı için doğru skor çek ve kaydet ──
          let saved = 0, skipped = 0;

          for (const row of wocRows) {
            const dbMatch = findDbMatch(row.homeTeam, row.awayTeam);
            if (!dbMatch) {
              console.log(`⚠ DB yok: ${row.homeTeam} vs ${row.awayTeam} (homeEN=${TR_EN[row.homeTeam]})`);
              continue;
            }

            const matchTime = new Date(dbMatch.match_datetime);
            if (matchTime <= new Date(now.getTime() - 30 * 60 * 1000)) {
              skipped++;
              continue; // Başlamış/geçmiş maç
            }

            console.log(`\n⚽ ${dbMatch.home_team} vs ${dbMatch.away_team} (${dbMatch.match_datetime})`);

            // Fixture'dan eşleşen match URL'ini bul
            // TR isim → slug dönüşümü ile arama yap
            const homeSlug = trToSlug(row.homeTeam);
            const awaySlug = trToSlug(row.awayTeam);
            const matchLink = allMacLinks.find(p => {
              const slug = p.split('/')[2] || '';
              const decodedSlug = decodeURIComponent(slug);
              return decodedSlug.includes(homeSlug.slice(0, 4)) && decodedSlug.includes('-vs-');
            });

            let correctScores = null;

            if (matchLink) {
              // Iddaa URL'ini doğrudan oluştur: /mac/team/hash → /mac/team/iddaa/hash
              const iddaaPath = matchPathToIddaaPath(matchLink);
              const iddaaUrl = `https://www.mackolik.com${iddaaPath}`;
              console.log(`  📎 Iddaa URL: ${iddaaUrl}`);

              try {
                await page.goto(iddaaUrl, { waitUntil: 'domcontentloaded', timeout: 25000 });
                await new Promise(r => setTimeout(r, 2500));

                // Sayfa başlığını ve body'yi kontrol et
                const pageCheck = await page.evaluate(() => ({
                  title: document.title,
                  url: location.href,
                  bodySnip: (document.body?.innerText || '').slice(0, 2000),
                }));

                console.log(`  Title: ${pageCheck.title}`);
                console.log(`  URL: ${pageCheck.url}`);
                console.log(`  Body (ilk 800): ${pageCheck.bodySnip.slice(0, 800)}`);

                // MAÇ SKORU bölümünü çek
                const scoreData = await page.evaluate(() => {
                  const scores = {};

                  // Tüm TD + span + div elementlerinde skor patternı ara
                  const allEls = [...document.querySelectorAll('td, span, div, p, li')];
                  for (const el of allEls) {
                    const text = (el.childNodes[0]?.nodeValue || el.innerText || '').trim();
                    if (!text) continue;

                    // "X-Y" skor formatı (0-0, 1-0, 2-1, vs.)
                    if (/^\d{1,2}-\d{1,2}$/.test(text)) {
                      // Kardeş veya sonraki element'teki oran
                      const siblings = [el.nextElementSibling, el.parentElement?.nextElementSibling];
                      for (const sib of siblings) {
                        if (!sib) continue;
                        const oddVal = parseFloat(sib.innerText?.trim() || '');
                        if (!isNaN(oddVal) && oddVal > 1 && oddVal < 1000) {
                          scores[text] = oddVal;
                          break;
                        }
                      }
                    }
                    // "Diğer" / "Diğerleri"
                    if (/di[gğ]er/i.test(text)) {
                      const siblings = [el.nextElementSibling, el.parentElement?.nextElementSibling];
                      for (const sib of siblings) {
                        if (!sib) continue;
                        const oddVal = parseFloat(sib.innerText?.trim() || '');
                        if (!isNaN(oddVal) && oddVal > 1 && oddVal < 1000) {
                          scores['_other'] = oddVal;
                          break;
                        }
                      }
                    }
                  }

                  // Alternatif: table satırlarında "X-Y | odd" formatı ara
                  for (const tr of document.querySelectorAll('tr')) {
                    const cells = [...tr.querySelectorAll('td,th')].map(c => c.innerText.trim());
                    if (cells.length >= 2) {
                      if (/^\d{1,2}-\d{1,2}$/.test(cells[0])) {
                        const odd = parseFloat(cells[1]);
                        if (!isNaN(odd) && odd > 1) scores[cells[0]] = odd;
                      }
                      if (/di[gğ]er/i.test(cells[0])) {
                        const odd = parseFloat(cells[1]);
                        if (!isNaN(odd) && odd > 1) scores['_other'] = odd;
                      }
                    }
                  }

                  return scores;
                });

                const scoreCount = Object.keys(scoreData).length;
                if (scoreCount >= 3) {
                  correctScores = scoreData;
                  console.log(`  ✅ Doğru skor: ${scoreCount} sonuç bulundu`);
                  const preview = Object.entries(scoreData).slice(0, 5).map(([k,v]) => `${k}:${v}`).join(', ');
                  console.log(`  Önizleme: ${preview}...`);
                } else {
                  console.log(`  ⚠ Doğru skor bulunamadı (${scoreCount} sonuç)`);
                }

              } catch (e) {
                console.log(`  ⚠ Iddaa sayfası hatası: ${e.message}`);
              }
            } else {
              console.log(`  ⚠ Fixture'da eşleşen maç URL'i bulunamadı (homeSlug=${homeSlug})`);
            }

            // DB'ye kaydet — h2h her zaman kaydedilir, doğru skor varsa eklenir
            const payload = {
              match_id: dbMatch.id,
              h2h_home: row.homeOdd,
              h2h_draw: row.drawOdd,
              h2h_away: row.awayOdd,
              is_manual: false,
              fetched_at: now.toISOString(),
            };
            if (correctScores && Object.keys(correctScores).length >= 3) {
              payload.correct_scores = correctScores;
            }

            const res = await fetch(
              `${SB_URL}/rest/v1/match_odds?on_conflict=match_id`,
              {
                method: 'POST',
                headers: {
                  apikey: SB_KEY,
                  Authorization: `Bearer ${SB_KEY}`,
                  'Content-Type': 'application/json',
                  Prefer: 'resolution=merge-duplicates',
                },
                body: JSON.stringify(payload),
              }
            );

            if (res.ok) {
              const scoreInfo = correctScores ? ` + ${Object.keys(correctScores).length} skor` : '';
              console.log(`  ✅ Kaydedildi: ${dbMatch.home_team} vs ${dbMatch.away_team}${scoreInfo}`);
              saved++;
            } else {
              const err = await res.text();
              console.error(`  ❌ Kayıt hatası: ${err}`);
            }

            await new Promise(r => setTimeout(r, 700));
          }

          await browser.close();
          console.log(`\n🏁 Tamamlandı: ${saved} kaydedildi, ${skipped} atlandı`);
          JSEOF
