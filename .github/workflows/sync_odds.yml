name: Maç Odds Senkronizasyonu (mackolik)

on:
  schedule:
    - cron: '0 9 * * *'  # Her gün 09:00 UTC = 12:00 TRT
  workflow_dispatch:

jobs:
  sync_odds:
    runs-on: ubuntu-latest
    steps:
      - name: Cache Puppeteer Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-v1

      - name: Puppeteer kur
        run: npm install puppeteer

      - name: Maç oranlarını çek
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node --input-type=module << 'JSEOF'
          import puppeteer from 'puppeteer';

          const SB_URL = process.env.SUPABASE_URL;
          const SB_KEY = process.env.SUPABASE_KEY;
          const FIXTURE_URL = 'https://www.mackolik.com/kupa/dünya-dünya-kupaşı/fikstur/70excpe1synn9kadnbppahdn7';

          // Kabul Et butonunu bul ve tıkla (Reddet DEĞİL)
          async function acceptConsent(pg) {
            for (const frame of [pg.mainFrame(), ...pg.frames()]) {
              try {
                const clicked = await frame.evaluate(() => {
                  const btns = [...document.querySelectorAll('button,[role="button"]')];
                  const btn = btns.find(b => {
                    const t = (b.innerText || b.textContent || '').toLowerCase().replace(/\s+/g, ' ').trim();
                    // "kabul et" veya "tümünü kabul et" — "reddet" içermemeli
                    return (t.includes('kabul') && !t.includes('reddet')) ||
                           t === 'accept all' || t === 'allow all' || t === 'i agree';
                  });
                  if (btn) { btn.click(); return (btn.innerText || btn.textContent).trim().slice(0, 50); }
                  return null;
                });
                if (clicked) { console.log(`🍪 Consent kabul: "${clicked}"`); return true; }
              } catch {}
            }
            return false;
          }

          const browser = await puppeteer.launch({
            args: ['--no-sandbox', '--disable-setuid-sandbox', '--disable-dev-shm-usage'],
          });
          const page = await browser.newPage();
          await page.setUserAgent(
            'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36'
          );
          await page.setExtraHTTPHeaders({ 'Accept-Language': 'tr-TR,tr;q=0.9' });
          await page.evaluateOnNewDocument(() => {
            Object.defineProperty(navigator, 'webdriver', { get: () => undefined });
          });

          // Önce ana sayfayı ziyaret et (session/cookie kur)
          console.log('📡 Ana sayfa...');
          await page.goto('https://www.mackolik.com/', { waitUntil: 'domcontentloaded', timeout: 30000 }).catch(() => {});
          await new Promise(r => setTimeout(r, 2000));
          await acceptConsent(page);
          await new Promise(r => setTimeout(r, 2000));

          // Fixture sayfası
          console.log(`\n🌐 Fixture: ${FIXTURE_URL}`);
          await page.goto(FIXTURE_URL, { waitUntil: 'domcontentloaded', timeout: 45000 }).catch(e =>
            console.log(`Nav hata: ${e.message}`)
          );
          await new Promise(r => setTimeout(r, 2000));
          await acceptConsent(page);

          // Lazy load için scroll
          await page.evaluate(() => window.scrollTo(0, document.body.scrollHeight));
          await new Promise(r => setTimeout(r, 3000));
          await page.evaluate(() => window.scrollTo(0, 0));
          await new Promise(r => setTimeout(r, 2000));

          // Body'yi detaylı incele
          const snap = await page.evaluate(() => {
            // Görünür body text
            const bodyText = (document.body?.innerText || '').trim().slice(0, 6000);

            // Body HTML (head'i atla)
            const bodyHtml = (document.body?.innerHTML || '').slice(0, 4000);

            // İç linkler (/mac/, /kupa/, /iddaa/ içerenler)
            const links = [...document.querySelectorAll('a[href]')]
              .map(a => ({ href: a.getAttribute('href'), text: (a.innerText || '').trim().slice(0, 40) }))
              .filter(l => l.href && (l.href.includes('/mac/') || l.href.includes('/iddaa/') || l.href.includes('/kupa/')))
              .slice(0, 40);

            // data-* attrları olan elementler (match ID olabilir)
            const dataEls = [...document.querySelectorAll('[data-id],[data-match],[data-event],[data-href],[data-url]')]
              .slice(0, 15)
              .map(el => ({
                tag: el.tagName,
                attrs: Object.fromEntries([...el.attributes].filter(a => a.name.startsWith('data-')).map(a => [a.name, a.value.slice(0, 60)])),
                text: (el.innerText || '').trim().slice(0, 50)
              }));

            // Match-like class elementler
            const matchEls = [
              ...document.querySelectorAll('[class*="match"],[class*="mac"],[class*="fikst"],[class*="event"],[class*="row"],[class*="card"],[class*="item"]')
            ].slice(0, 15).map(el => ({
              tag: el.tagName,
              class: [...el.classList].join(' ').slice(0, 80),
              href: el.getAttribute('href'),
              text: (el.innerText || '').trim().slice(0, 80)
            }));

            // Sayfadaki tüm iç linkler (debug)
            const allInternalLinks = [...document.querySelectorAll('a[href^="/"]')]
              .map(a => a.getAttribute('href'))
              .filter((v, i, arr) => arr.indexOf(v) === i)
              .slice(0, 50);

            return { bodyText, bodyHtml, links, dataEls, matchEls, allInternalLinks };
          });

          console.log('\n══════════ BODY TEXT ══════════');
          console.log(snap.bodyText || '(boş)');

          console.log('\n══════════ /mac/ + /iddaa/ LİNKLER ══════════');
          snap.links.forEach(l => console.log(`  ${l.href}  →  "${l.text}"`));
          if (!snap.links.length) console.log('  (yok)');

          console.log('\n══════════ TÜM İÇ LİNKLER ══════════');
          snap.allInternalLinks.forEach(l => console.log(`  ${l}`));

          console.log('\n══════════ DATA ATTRLAR ══════════');
          snap.dataEls.forEach(el => console.log(`  <${el.tag}> ${JSON.stringify(el.attrs)} "${el.text}"`));
          if (!snap.dataEls.length) console.log('  (yok)');

          console.log('\n══════════ MATCH-CLASS ELEMENTLER ══════════');
          snap.matchEls.forEach(el => console.log(`  <${el.tag}> class="${el.class}" href="${el.href}" text="${el.text}"`));
          if (!snap.matchEls.length) console.log('  (yok)');

          console.log('\n══════════ BODY HTML ══════════');
          console.log(snap.bodyHtml);

          await browser.close();
          console.log('\n🏁 Keşif tamamlandı.');
          JSEOF
