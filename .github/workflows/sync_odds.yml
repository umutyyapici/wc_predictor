name: Maç Odds Senkronizasyonu (mackolik)

on:
  schedule:
    - cron: '0 9 * * *'  # Her gün 09:00 UTC = 12:00 TRT
  workflow_dispatch:

jobs:
  sync_odds:
    runs-on: ubuntu-latest
    steps:
      - name: Cache Puppeteer Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-v1

      - name: Puppeteer kur
        run: npm install puppeteer

      - name: Maç oranlarını çek
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node --input-type=module << 'JSEOF'
          import puppeteer from 'puppeteer';

          const SB_URL = process.env.SUPABASE_URL;
          const SB_KEY = process.env.SUPABASE_KEY;

          // Her iki URL varyantını dene (kupası / kupaşı)
          const FIXTURE_URLS = [
            'https://www.mackolik.com/kupa/dünya-dünya-kupaşı/fikstur/70excpe1synn9kadnbppahdn7',
            'https://www.mackolik.com/kupa/dünya-dünya-kupası/fikstur/70excpe1synn9kadnbppahdn7',
          ];

          // DB'den tüm maçları çek
          const dbRes = await fetch(
            `${SB_URL}/rest/v1/matches?select=id,match_datetime,home_team,away_team&order=match_datetime`,
            { headers: { apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}` } }
          );
          const dbMatches = await dbRes.json();
          console.log(`📚 DB'de ${dbMatches.length} maç`);

          // Zaman bazlı eşleme (±30 dk)
          function findDbMatch(startDate) {
            if (!startDate || isNaN(startDate)) return null;
            return dbMatches.find(m => Math.abs(new Date(m.match_datetime) - startDate) < 30 * 60 * 1000) || null;
          }

          const browser = await puppeteer.launch({
            args: ['--no-sandbox', '--disable-setuid-sandbox', '--disable-dev-shm-usage'],
          });
          const page = await browser.newPage();
          await page.setUserAgent(
            'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36'
          );
          await page.setExtraHTTPHeaders({ 'Accept-Language': 'tr-TR,tr;q=0.9' });

          // Headless tespitini engelle
          await page.evaluateOnNewDocument(() => {
            Object.defineProperty(navigator, 'webdriver', { get: () => undefined });
          });

          // ── 1. Fixture sayfası: maç URL'lerini topla ────────────
          let matchUrls = [];
          for (const fUrl of FIXTURE_URLS) {
            console.log(`\n🌐 ${fUrl}`);
            try {
              await page.goto(fUrl, { waitUntil: 'networkidle2', timeout: 45000 });
            } catch {
              try { await page.goto(fUrl, { waitUntil: 'domcontentloaded', timeout: 30000 }); }
              catch (e) { console.log(`  ❌ Yüklenemedi: ${e.message}`); continue; }
            }

            // /iddaa/ linklerinin DOM'a gelmesini bekle
            await page.waitForSelector('a[href*="/iddaa/"]', { timeout: 15000 }).catch(() => {});

            matchUrls = await page.$$eval(
              'a[href*="/iddaa/"]',
              els => [...new Set(els.map(e => e.getAttribute('href')).filter(h => h?.startsWith('/mac/')))]
            );

            if (matchUrls.length > 0) {
              console.log(`✅ ${matchUrls.length} maç URL'i bulundu`);
              break;
            }

            // Keşif: HTML dump
            const html = await page.content();
            console.log(`⚠ Link bulunamadı — HTML (1500 chr):\n${html.slice(0, 1500)}`);
          }

          if (matchUrls.length === 0) {
            console.log('❌ Hiç maç URL\'i bulunamadı.');
            await browser.close();
            process.exit(0);
          }

          // ── 2. Her maç için iddaa sayfası ───────────────────────
          let saved = 0, skipped = 0;

          for (const matchPath of matchUrls) {
            const fullUrl = `https://www.mackolik.com${matchPath}`;
            try {
              try {
                await page.goto(fullUrl, { waitUntil: 'networkidle2', timeout: 30000 });
              } catch {
                await page.goto(fullUrl, { waitUntil: 'domcontentloaded', timeout: 20000 });
              }
              await new Promise(r => setTimeout(r, 800));

              const info = await page.evaluate(() => {
                // Tarih: JSON-LD > datetime attr > time tag
                const jsonLd = [...document.querySelectorAll('script[type="application/ld+json"]')]
                  .map(s => { try { return JSON.parse(s.textContent); } catch { return null; } })
                  .filter(Boolean).find(d => d.startDate || d.startTime || d.eventDate);
                const dateStr = jsonLd?.startDate || jsonLd?.startTime || jsonLd?.eventDate
                  || document.querySelector('[datetime]')?.getAttribute('datetime')
                  || document.querySelector('time')?.textContent?.trim();

                // Sayfa başlığından takım isimleri (genellikle "Norveç - Senegal İddaa Oranları")
                const title = document.title || '';

                // Tüm /iddaa/ sayfasının text özeti
                const bodyText = document.body?.innerText?.slice(0, 2000) || '';

                // Tablolar (oran tablosu olabilir)
                const tables = [...document.querySelectorAll('table')].map(t => ({
                  caption: t.querySelector('caption, thead th')?.innerText?.trim()?.slice(0, 60),
                  rows: [...t.querySelectorAll('tr')].slice(0, 4).map(r =>
                    [...r.querySelectorAll('td, th')].map(c => c.innerText?.trim()).filter(Boolean).join(' | ')
                  ).filter(Boolean)
                })).filter(t => t.rows.length > 0);

                // CSS class isimlerini keşfet
                const classes = [...new Set(
                  [...document.querySelectorAll('[class]')]
                    .flatMap(el => [...el.classList])
                    .filter(c => c.length > 3 && !/^(css|_|r[A-Z])/.test(c))
                )].slice(0, 50);

                return { dateStr, title, bodyText, tables, classes };
              });

              console.log(`\n📋 ${matchPath}`);
              console.log(`   Başlık : ${info.title}`);
              console.log(`   Tarih  : ${info.dateStr}`);
              console.log(`   Body   : ${info.bodyText.slice(0, 400)}`);
              if (info.tables.length) {
                console.log(`   Tablolar (${info.tables.length}):`);
                info.tables.forEach(t => {
                  console.log(`     [${t.caption}]`);
                  t.rows.forEach(r => console.log(`       ${r}`));
                });
              }
              console.log(`   Classes: ${info.classes.join(', ')}`);

              // Zaman bazlı DB eşlemesi
              const startDate = info.dateStr ? new Date(info.dateStr) : null;
              const dbMatch = findDbMatch(startDate);
              if (dbMatch) {
                console.log(`   ✅ DB: ${dbMatch.home_team} vs ${dbMatch.away_team} (${dbMatch.match_datetime})`);
              } else {
                console.log(`   ⚠ DB eşleşme yok — dateStr="${info.dateStr}"`);
              }

            } catch (err) {
              console.error(`❌ ${matchPath}: ${err.message}`);
            }
          }

          await browser.close();
          console.log(`\n🏁 Keşif tamamlandı. ${matchUrls.length} URL işlendi.`);
          console.log('Bir sonraki adım: loglardan oran yapısını okuyup odds parse eklemek.');
          JSEOF
